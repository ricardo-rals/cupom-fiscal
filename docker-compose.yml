# Traces dos três serviços vão para o Jaeger local: http://localhost:16686
x-otel: &otel
  OTEL_TRACES_EXPORTER: otlp
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

x-database-url: &database-url postgres://${POSTGRES_USER:-cupom}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cupom}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cupom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-cupom}
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  # Estágio de build da api: tem o CLI do Prisma, que a imagem final não leva.
  migrate:
    build: { context: apps/api, target: build }
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db: { condition: service_healthy }

  jaeger:
    image: jaegertracing/jaeger:2.5.0
    ports: ["16686:16686"]

  ai:
    build: apps/ai
    environment:
      <<: *otel
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Só o agente usa: papel que lê as três views e nada mais.
      AGENT_DATABASE_URL: postgres://agent_ro:${AGENT_RO_PASSWORD:-}@db:5432/${POSTGRES_DB:-cupom}
    ports: ["8000:8000"]

  api:
    build: apps/api
    environment:
      <<: *otel
      PORT: 3000
      DATABASE_URL: *database-url
      AI_URL: http://ai:8000
      LLM_LIMITE_MENSAL_USD: ${LLM_LIMITE_MENSAL_USD:-5}
      NORMALIZACAO_LIMIAR: ${NORMALIZACAO_LIMIAR:-0.8}
      AGENT_RO_PASSWORD: ${AGENT_RO_PASSWORD:-}
    ports: ["3001:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      ai: { condition: service_started }

  web:
    build: apps/web
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: web
      API_URL: http://api:3000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  db-data:
