x-database-url: &database-url postgres://${POSTGRES_USER:-cupom}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cupom}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cupom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-cupom}
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  # Estágio de build da api: tem o CLI do Prisma, que a imagem final não leva.
  migrate:
    build: { context: apps/api, target: build }
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db: { condition: service_healthy }

  ai:
    build: apps/ai
    ports: ["8000:8000"]

  api:
    build: apps/api
    environment:
      PORT: 3000
      DATABASE_URL: *database-url
      AI_URL: http://ai:8000
    ports: ["3001:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      ai: { condition: service_started }

  web:
    build: apps/web
    environment:
      API_URL: http://api:3000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  db-data:
