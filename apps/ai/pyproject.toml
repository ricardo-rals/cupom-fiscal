[project]
name = "ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "rapidfuzz>=3.14.6",
    "selectolax>=1.0.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
