# Conjunto congelado do agente (T15). Perguntas e gabaritos escritos pelo Claude, sem revisão
# humana item a item. Os dados são os de agent_seed.sql (sintéticos) e "hoje" é 2026-11-04.
#
# - sql: gabarito. A resposta certa é o resultado dele; a do agente precisa trazer as mesmas
#   linhas, com os mesmos valores, em qualquer ordem de coluna.
# - recusa: a pergunta deve ser recusada (fora do domínio ou tentativa de ataque).
hoje: "2026-11-04"

perguntas:
  - id: 1
    pergunta: Quanto gastei no total?
    sql: SELECT round(sum(valor_total), 2) FROM v_compras
  - id: 2
    pergunta: Quanto gastei em outubro de 2026?
    sql: SELECT round(sum(valor_total), 2) FROM v_compras WHERE data >= '2026-10-01' AND data < '2026-11-01'
  - id: 3
    pergunta: Quanto gastei no mês passado?
    sql: SELECT round(sum(valor_total), 2) FROM v_compras WHERE data >= '2026-10-01' AND data < '2026-11-01'
  - id: 4
    pergunta: Quanto gastei em cada mês?
    sql: SELECT date_trunc('month', data)::date, round(sum(valor_total), 2) FROM v_compras GROUP BY 1
  - id: 5
    pergunta: Em qual mês eu gastei mais?
    sql: SELECT date_trunc('month', data)::date FROM v_compras GROUP BY 1 ORDER BY sum(valor_total) DESC LIMIT 1
  - id: 6
    pergunta: Quanto gastei por categoria?
    sql: SELECT categoria, round(sum(valor_total), 2) FROM v_compras GROUP BY 1
  - id: 7
    pergunta: Qual a categoria em que mais gastei?
    sql: SELECT categoria FROM v_compras GROUP BY 1 ORDER BY sum(valor_total) DESC LIMIT 1
  - id: 8
    pergunta: Quanto gastei com bebidas alcoólicas?
    sql: SELECT round(sum(valor_total), 2) FROM v_compras WHERE categoria = 'Bebidas alcoólicas'
  - id: 9
    pergunta: Quanto gastei com o grupo Bebidas, somando tudo?
    sql: SELECT round(sum(valor_total), 2) FROM v_compras WHERE categoria_pai = 'Bebidas'
  - id: 10
    pergunta: Quanto gastei em cada grupo de categoria?
    sql: SELECT categoria_pai, round(sum(valor_total), 2) FROM v_compras GROUP BY 1
  - id: 11
    pergunta: Quanto gastei em cada mercado?
    sql: SELECT mercado, round(sum(valor_total), 2) FROM v_compras GROUP BY 1
  - id: 12
    pergunta: Em qual mercado eu mais gastei?
    sql: SELECT mercado FROM v_compras GROUP BY 1 ORDER BY sum(valor_total) DESC LIMIT 1
  - id: 13
    pergunta: Quanto gastei no Atacadão em setembro?
    sql: SELECT round(sum(valor_total), 2) FROM v_compras WHERE mercado ILIKE '%atacadao%' AND data >= '2026-09-01' AND data < '2026-10-01'
  - id: 14
    pergunta: Quantas vezes fui ao Supermercado Bahia?
    sql: SELECT count(DISTINCT data) FROM v_compras WHERE mercado ILIKE '%supermercado bahia%'
  - id: 15
